server:
    port: 8081
    servlet:
        context-path: /movies-api
    error:
        include-stacktrace: never
    compression:
        enabled: true
        mime-types: application/json
        min-response-size: 1024

spring:
    config:
        import: optional:file:.env[.properties]
    profiles:
        active: dev
    banner:
        location: classpath:banner.txt
    datasource:
        driver-class-name: org.mariadb.jdbc.Driver
        url: jdbc:mariadb://${DB_HOST:localhost}:3306/moviesdb
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
    jpa:
        show-sql: true
        properties:
            hibernate:
                format_sql: false
                transaction:
                    jta:
                        platform: false

# Omdb API
# The OMDb API is a RESTful web service to obtain movie information, all
# content and images on the site are contributed and maintained by our users.
omdb:
    api:
        base-url: http://www.omdbapi.com
        key: ${OMDB_API_KEY}

app:
    secret:
        key: ${APP_SECRET_KEY}
        salt: ${APP_SECRET_SALT}
